# Streamlit Cloud Secrets Template
# Copy this file to .streamlit/secrets.toml and fill in your actual values

[google_oauth]
client_id = "YOUR_CLIENT_ID_HERE"
client_secret = "YOUR_CLIENT_SECRET_HERE"

# Optional flat keys for local development
# GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID_HERE"
# GOOGLE_CLIENT_SECRET = "YOUR_CLIENT_SECRET_HERE"

# Firebase service account JSON
# firebase = { "type" = "service_account", "project_id" = "...", ... }
# Or set FIREBASE_SERVICE_ACCOUNT_JSON in your local environment. 